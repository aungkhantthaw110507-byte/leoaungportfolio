<style>
@media print {
    /* 1. Page Setup */
    @page {
        size: A3 landscape;
        margin: 0;
    }

    /* 2. Strip Global Margins and Force Colors */
    body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    /* 3. Hide Unnecessary UI */
    #ribbon-nav, header, footer, .no-print, 
    #autocad-cursor-h, #autocad-cursor-v, #autocad-cursor-box, #autocad-select-box {
        display: none !important;
    }

    /* 4. Neutralize the <main> container */
    main {
        margin: 0 !important;
        padding: 0 !important;
    }
    main > * + * {
        margin-top: 0 !important;
    }

    /* 5. Force sections to exact A3 size with internal padding */
    section {
        width: 420mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 12mm !important; /* Uniform print safe-zone */
        page-break-after: always !important;
        break-after: page !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        overflow: hidden !important;
        position: relative !important;
        box-sizing: border-box !important;
    }

    /* 6. Clean up portfolio containers so they fill the padded section perfectly */
    .portfolio-page {
        width: 100% !important;
        height: 100% !important;
        max-height: 297mm !important;
        box-shadow: none !important;
        border: none !important;
        margin: 0 !important;
        padding: 0 !important; 
        page-break-inside: avoid !important;
    }

    /* 7. Cover Page Specific Fixes (Fixes the overlapping text issue) */
    #slide-1 {
        padding: 24mm !important; /* Give the cover slightly more breathing room */
    }
    #slide-1 h1 {
        font-size: 85pt !important; /* Lock VW to static PT to prevent stretching */
        line-height: 1 !important;
    }
    #slide-1 .text-xl {
        font-size: 20pt !important;
    }

    /* 8. Reset specific slide exceptions that ruin print sizing */
    #slide-8 .portfolio-page {
        aspect-ratio: auto !important; 
    }
}
</style>
